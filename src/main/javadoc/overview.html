<p>잔디(Jandi)는 기여도가 보이는 대학생 팀 프로젝트 협업 프로그램입니다.
팀원마다 박스가 하나씩 있는 목장 화면에서, 박스 크기는 로컬 git 저장소의 커밋으로 계산한 기여도에 비례합니다.</p>
<ul>
<li>{@code jandi.domain}: 팀원, 할 일, 커밋, 기여도</li>
<li>{@code jandi.service}: 할 일 처리, git 읽기, 기여도 계산</li>
<li>{@code jandi.store}: CSV 저장, 샘플 데이터</li>
<li>{@code jandi.ui}: Swing 화면</li>
</ul>
